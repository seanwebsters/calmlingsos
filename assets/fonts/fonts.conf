<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Bundled fonts for hosts without system fonts (e.g. Vercel). Used when
     src/lib/media/fonts.ts points FONTCONFIG_FILE here. -->
<fontconfig>
  <dir prefix="relative">.</dir>
  <cachedir>/tmp/calmlings-fontconfig</cachedir>
  <alias><family>serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias><family>Liberation Serif</family><prefer><family>DejaVu Serif</family></prefer></alias>
  <alias><family>Inter</family><prefer><family>DejaVu Sans</family></prefer></alias>
</fontconfig>
